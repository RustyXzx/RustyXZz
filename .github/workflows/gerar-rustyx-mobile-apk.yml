name: Gerar APK RustyX Mobile Optimizer

on:
  push:
    branches: [ "rustyx-mobile-apk" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          rm -rf mobile-build
          mkdir mobile-build
          unzip -q RustyX_Mobile_Optimizer_Project.zip -d mobile-build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: mobile-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Renomear APK
        run: cp mobile-build/app/build/outputs/apk/debug/app-debug.apk RustyX-Mobile-Optimizer-Teste.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RustyX-Mobile-Optimizer-APK
          path: RustyX-Mobile-Optimizer-Teste.apk
          retention-days: 30
