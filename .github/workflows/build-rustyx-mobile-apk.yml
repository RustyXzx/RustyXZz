name: Build RustyX Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["rustyx-mobile-apk"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-rustyx-mobile-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:clean :app:assembleRelease

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RustyX-Mobile-Optimizer-v0.3.1.apk
          sha256sum RustyX-Mobile-Optimizer-v0.3.1.apk > RustyX-Mobile-Optimizer-v0.3.1.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RustyX-Mobile-Optimizer-v0.3.1
          path: |
            RustyX-Mobile-Optimizer-v0.3.1.apk
            RustyX-Mobile-Optimizer-v0.3.1.sha256.txt
          retention-days: 90
