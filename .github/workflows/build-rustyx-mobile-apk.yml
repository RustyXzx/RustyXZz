name: Build RustyX Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["rustyx-mobile-apk"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create compatible Android project
        shell: bash
        run: |
          rm -rf mobile
          mkdir -p mobile/app/src/main/java/com/rustyx/mobile/optimizer
          mkdir -p mobile/app/src/main/res/values
          mkdir -p mobile/app/src/main/res/drawable

          cat > mobile/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RustyXMobileOptimizer"
          include ':app'
          EOF

          cat > mobile/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > mobile/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mobile/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rustyx.mobile.optimizer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rustyx.mobile.optimizer'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '0.3.0'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                      v1SigningEnabled true
                      v2SigningEnabled true
                      v3SigningEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mobile/app/proguard-rules.pro <<'EOF'
          -keep class com.rustyx.mobile.optimizer.** { *; }
          EOF

          cat > mobile/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">RustyX Mobile Optimizer</string>
          </resources>
          EOF

          cat > mobile/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.RustyX" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#FFFFFF</item>
                  <item name="android:statusBarColor">#050505</item>
                  <item name="android:navigationBarColor">#050505</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowBackground">#050505</item>
              </style>
          </resources>
          EOF

          cat > mobile/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#050505" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F4F4F5" android:pathData="M22,21 L69,21 C83,21 91,29 91,42 C91,53 85,60 75,63 L92,87 L75,87 L58,65 L48,65 L48,87 L31,87 L31,38 L48,38 L48,51 L67,51 C72,51 75,48 75,43 C75,38 72,35 67,35 L31,35 Z"/>
              <path android:fillColor="#8E8E93" android:pathData="M22,21 L31,35 L31,87 L22,87 Z"/>
          </vector>
          EOF

          cat > mobile/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:installLocation="auto"
                  android:label="RustyX Mobile Optimizer"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.RustyX">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > mobile/app/src/main/java/com/rustyx/mobile/optimizer/MainActivity.java <<'EOF'
          package com.rustyx.mobile.optimizer;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.os.BatteryManager;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.StatFs;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.util.Locale;

          public final class MainActivity extends Activity {
              private TextView statusText;
              private TextView memoryText;
              private TextView storageText;
              private TextView batteryText;
              private TextView networkText;
              private TextView cacheText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(5, 5, 5));
                  getWindow().setNavigationBarColor(Color.rgb(5, 5, 5));
                  buildInterface();
                  refreshStatus();
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              private TextView text(String value, int size, int color, boolean bold) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  view.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return view;
              }

              private LinearLayout card(String title, TextView value) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(18), dp(16), dp(18), dp(16));
                  card.setBackgroundColor(Color.rgb(18, 18, 20));

                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(-1, -2);
                  params.setMargins(0, 0, 0, dp(10));
                  card.setLayoutParams(params);

                  card.addView(text(title, 12, Color.rgb(150, 150, 158), true));
                  LinearLayout.LayoutParams valueParams = new LinearLayout.LayoutParams(-1, -2);
                  valueParams.topMargin = dp(6);
                  value.setLayoutParams(valueParams);
                  card.addView(value);
                  return card;
              }

              private Button action(String label, View.OnClickListener listener) {
                  Button button = new Button(this);
                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(13);
                  button.setAllCaps(false);
                  button.setBackgroundColor(Color.rgb(28, 28, 31));
                  button.setOnClickListener(listener);

                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(-1, dp(54));
                  params.setMargins(0, 0, 0, dp(10));
                  button.setLayoutParams(params);
                  return button;
              }

              private void buildInterface() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(5, 5, 5));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(22), dp(18), dp(30));
                  scroll.addView(root);

                  TextView brand = text("RUSTYX", 30, Color.WHITE, true);
                  brand.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(brand);

                  TextView subtitle = text("Mobile Optimizer 0.3.0", 13, Color.rgb(150, 150, 158), false);
                  subtitle.setGravity(Gravity.CENTER_HORIZONTAL);
                  LinearLayout.LayoutParams subtitleParams = new LinearLayout.LayoutParams(-1, -2);
                  subtitleParams.setMargins(0, dp(2), 0, dp(22));
                  subtitle.setLayoutParams(subtitleParams);
                  root.addView(subtitle);

                  statusText = text("Analisando aparelho...", 14, Color.WHITE, true);
                  memoryText = text("--", 20, Color.WHITE, true);
                  storageText = text("--", 20, Color.WHITE, true);
                  batteryText = text("--", 20, Color.WHITE, true);
                  networkText = text("--", 20, Color.WHITE, true);
                  cacheText = text("--", 20, Color.WHITE, true);

                  root.addView(card("STATUS", statusText));
                  root.addView(card("MEMÓRIA DISPONÍVEL", memoryText));
                  root.addView(card("ARMAZENAMENTO LIVRE", storageText));
                  root.addView(card("BATERIA", batteryText));
                  root.addView(card("REDE", networkText));
                  root.addView(card("CACHE DO RUSTYX", cacheText));

                  TextView title = text("Ferramentas de otimização", 17, Color.WHITE, true);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(-1, -2);
                  titleParams.setMargins(0, dp(16), 0, dp(12));
                  title.setLayoutParams(titleParams);
                  root.addView(title);

                  root.addView(action("Otimização rápida do RustyX", v -> optimizeRustyX()));
                  root.addView(action("Limpeza de armazenamento do Android", v -> openSetting(Settings.ACTION_INTERNAL_STORAGE_SETTINGS)));
                  root.addView(action("Economia de bateria", v -> openSetting(Settings.ACTION_BATTERY_SAVER_SETTINGS)));
                  root.addView(action("Informações do RustyX", v -> {
                      Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      intent.setData(android.net.Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  }));
                  root.addView(action("Atualizar diagnóstico", v -> refreshStatus()));

                  TextView warning = text(
                      "O Android não permite que aplicativos comuns encerrem outros apps ou apaguem o cache deles. O RustyX usa somente ações oficiais, sem root e sem promessas falsas.",
                      12,
                      Color.rgb(145, 145, 152),
                      false);
                  warning.setLineSpacing(0, 1.25f);
                  LinearLayout.LayoutParams warningParams = new LinearLayout.LayoutParams(-1, -2);
                  warningParams.setMargins(0, dp(12), 0, 0);
                  warning.setLayoutParams(warningParams);
                  root.addView(warning);

                  setContentView(scroll);
              }

              private void refreshStatus() {
                  ActivityManager manager = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  ActivityManager.MemoryInfo info = new ActivityManager.MemoryInfo();
                  if (manager != null) {
                      manager.getMemoryInfo(info);
                  }

                  StatFs storage = new StatFs(Environment.getDataDirectory().getPath());
                  BatteryManager battery = (BatteryManager) getSystemService(BATTERY_SERVICE);
                  int batteryPercent = battery == null
                      ? -1
                      : battery.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY);

                  statusText.setText(info.lowMemory
                      ? "Atenção: pouca memória disponível"
                      : "Aparelho em condição normal");
                  statusText.setTextColor(info.lowMemory
                      ? Color.rgb(255, 95, 100)
                      : Color.rgb(70, 215, 125));

                  memoryText.setText(formatBytes(info.availMem) + " de " + formatBytes(info.totalMem));
                  storageText.setText(formatBytes(storage.getAvailableBytes()) + " de " + formatBytes(storage.getTotalBytes()));
                  batteryText.setText(batteryPercent < 0 ? "Não disponível" : batteryPercent + "%");
                  networkText.setText(isOnline() ? "Conectado à internet" : "Sem conexão");
                  cacheText.setText(formatBytes(directorySize(getCacheDir())));
              }

              private boolean isOnline() {
                  ConnectivityManager manager = getSystemService(ConnectivityManager.class);
                  if (manager == null) {
                      return false;
                  }

                  Network network = manager.getActiveNetwork();
                  if (network == null) {
                      return false;
                  }

                  NetworkCapabilities capabilities = manager.getNetworkCapabilities(network);
                  return capabilities != null
                      && capabilities.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET);
              }

              private void optimizeRustyX() {
                  long before = directorySize(getCacheDir());
                  boolean success = deleteChildren(getCacheDir());
                  onTrimMemory(TRIM_MEMORY_COMPLETE);
                  System.gc();
                  refreshStatus();

                  String result = before > 0
                      ? formatBytes(before) + " liberados"
                      : "O cache do RustyX já estava limpo";
                  Toast.makeText(
                      this,
                      success ? result : "A limpeza não foi concluída",
                      Toast.LENGTH_LONG).show();
              }

              private void openSetting(String action) {
                  try {
                      startActivity(new Intent(action));
                  } catch (Exception error) {
                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                  }
              }

              private long directorySize(File file) {
                  if (file == null || !file.exists()) {
                      return 0;
                  }
                  if (file.isFile()) {
                      return file.length();
                  }

                  long total = 0;
                  File[] children = file.listFiles();
                  if (children != null) {
                      for (File child : children) {
                          total += directorySize(child);
                      }
                  }
                  return total;
              }

              private boolean deleteChildren(File directory) {
                  if (directory == null || !directory.exists()) {
                      return true;
                  }

                  boolean success = true;
                  File[] children = directory.listFiles();
                  if (children != null) {
                      for (File child : children) {
                          if (child.isDirectory()) {
                              success &= deleteChildren(child);
                          }
                          success &= child.delete();
                      }
                  }
                  return success;
              }

              private String formatBytes(long bytes) {
                  if (bytes < 1024) {
                      return bytes + " B";
                  }

                  double value = bytes;
                  String[] units = {"KB", "MB", "GB", "TB"};
                  int unit = -1;
                  do {
                      value /= 1024.0;
                      unit++;
                  } while (value >= 1024 && unit < units.length - 1);

                  return String.format(Locale.getDefault(), "%.1f %s", value, units[unit]);
              }
          }
          EOF

      - name: Build signed release APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RustyX-Mobile-Optimizer-v0.3.0.apk
          sha256sum RustyX-Mobile-Optimizer-v0.3.0.apk > RustyX-Mobile-Optimizer-v0.3.0.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RustyX-Mobile-Optimizer-v0.3.0
          path: |
            RustyX-Mobile-Optimizer-v0.3.0.apk
            RustyX-Mobile-Optimizer-v0.3.0.sha256.txt
          retention-days: 90
